<button
    type="button"
    class="disparador"
    [class.vacio]="!valor()"
    [disabled]="deshabilitado()"
    (click)="alternar()">
    <span>{{ etiqueta() }}</span>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M3 9.5h18" stroke="currentColor" stroke-width="1.6" />
        <path d="M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
</button>

@if (abierto()) {
<div class="calendario" role="dialog">
    <div class="encabezado">
        <button type="button" class="nav" (click)="irMesAnterior()" aria-label="Mes anterior">‹</button>

        <span class="selectores">
            <select [ngModel]="vistaMes()" (ngModelChange)="irAMes($event)" aria-label="Mes">
                @for (m of meses; track m; let i = $index) {
                <option [value]="i">{{ m }}</option>
                }
            </select>
            <select [ngModel]="vistaAnio()" (ngModelChange)="irAAnio($event)" aria-label="Año">
                @for (a of anios(); track a) {
                <option [value]="a">{{ a }}</option>
                }
            </select>
        </span>

        <button type="button" class="nav" (click)="irMesSiguiente()" aria-label="Mes siguiente">›</button>
    </div>

    <div class="semana">
        @for (d of diasSemana; track d) {
        <span>{{ d }}</span>
        }
    </div>

    <div class="grilla">
        @for (c of celdas(); track c.iso) {
        <button
            type="button"
            class="dia"
            [class.fuera]="!c.delMes"
            [class.hoy]="c.esHoy"
            [class.elegido]="c.iso === valor()"
            (click)="elegir(c)">
            {{ c.dia }}
        </button>
        }
    </div>

    <button type="button" class="hoy-btn" (click)="irHoy()">Hoy</button>
</div>
}
