<div class="campo">
    @if (flechas) {
    <button
        type="button"
        class="flecha"
        [disabled]="deshabilitado()"
        (click)="mover(-1)"
        aria-label="Día anterior">‹</button>
    }

    <input
        type="text"
        inputmode="numeric"
        placeholder="dd/mm/aaaa"
        maxlength="10"
        autocomplete="off"
        [class.invalida]="invalida()"
        [value]="texto()"
        [disabled]="deshabilitado()"
        (input)="escribir($any($event.target))"
        (blur)="tocar()" />

    @if (flechas) {
    <button
        type="button"
        class="flecha"
        [disabled]="deshabilitado()"
        (click)="mover(1)"
        aria-label="Día siguiente">›</button>
    }
</div>

@if (invalida()) {
<span class="mensaje">Esa fecha no existe.</span>
}

@if (atajos > 0) {
<div class="atajos">
    @for (a of listaAtajos(); track a.iso) {
    <button
        type="button"
        class="atajo"
        [class.elegido]="a.iso === valor()"
        [disabled]="deshabilitado()"
        (click)="elegir(a.iso)">
        {{ a.etiqueta }}
    </button>
    }
</div>
}
