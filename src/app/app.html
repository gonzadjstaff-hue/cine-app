<header class="barra">
  <a class="marca" routerLink="/cartelera">{{ nombre }}</a>

  <nav>
    <a routerLink="/cartelera" routerLinkActive="activo">Cartelera</a>
    <a routerLink="/proximamente" routerLinkActive="activo">Próximamente</a>

    @if (auth.esAdmin()) {
      <a routerLink="/admin/peliculas" routerLinkActive="activo">Películas</a>
      <a routerLink="/admin/funciones" routerLinkActive="activo">Funciones</a>
    }

    @if (auth.esStaff()) {
      <a routerLink="/validar" routerLinkActive="activo">Validar</a>
    }

    @if (auth.autenticado()) {
      <a routerLink="/mis-compras" routerLinkActive="activo">Mis compras</a>
      <span class="usuario">
        {{ auth.nombreCompleto() }}
        @if (auth.esStaff()) {
          <em class="rol">{{ auth.rol() }}</em>
        }
      </span>
      <button type="button" class="salir" (click)="salir()">Salir</button>
    } @else {
      <a routerLink="/ingresar" routerLinkActive="activo">Ingresar</a>
      <a routerLink="/registro" routerLinkActive="activo">Crear cuenta</a>
    }
  </nav>
</header>

<main class="contenido">
  <router-outlet />
</main>
